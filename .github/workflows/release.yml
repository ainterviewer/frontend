name: release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
  # Pull requests run the test job only: the docker and github-release jobs
  # below require a version tag ref, which a PR event never has.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    name: Lint, Types & Unit Tests

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      # `prepare` runs svelte-kit sync, which generates the types the next two
      # steps type-check against.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check types
        run: bun run check

      # The vitest `client` project runs the *.svelte.test.ts files in a real
      # chromium via @vitest/browser-playwright, so the browser has to be there
      # or those files are skipped while the run still reports success. Use the
      # pinned binary from node_modules, not bunx, so the browser build matches
      # the installed playwright.
      - name: Install chromium for browser unit tests
        run: ./node_modules/.bin/playwright install --with-deps chromium

      # Unit tests only. The Playwright e2e suite also needs a running server
      # and takes minutes rather than seconds -- it does not belong on every
      # pull request.
      - name: Unit tests
        run: bun run test:unit --run

  docker:
    # Tag pushes publish a release; a manual run from a branch publishes a
    # staging preview of that branch. The tag list below decides which sticky
    # tags each case is allowed to move.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [test]
    name: Docker Build & Publish

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # "Not a pre-release" is a stricter question than "does the tag say rc":
      # uv also offers alpha and beta bumps, which produce v0.6.3a1 and v0.6.3b1.
      # Neither contains "rc", so a substring test let them move the tag prod
      # follows. Match the shape of a final release instead.
      - name: Classify the ref
        id: release
        run: |
          if [[ "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "final=true" >> "$GITHUB_OUTPUT"
          else
            echo "final=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            # 'latest' is the tag prod follows. It moves only for a tag shaped
            # exactly like a final release -- see the Classify step above, which
            # covers branch refs and every pre-release spelling in one rule.
            type=raw,value=latest,enable=${{ steps.release.outputs.final == 'true' }}
            # Staging follows every release, release candidates included, so a
            # candidate can be exercised there without moving the tag prod
            # follows. A manual run from a feature branch moves it too: that is
            # how a branch is previewed on staging without spending a version
            # number or publishing a GitHub Release.
            type=raw,value=staging
            # A branch build is the one case with no version tag to identify it,
            # so stamp the commit for "what is staging actually running?".
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.AINTERVIEWER_GITHUB_TOKEN }}

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [docker]
    name: GitHub Release

    permissions:
      contents: write

    steps:
      # Full history + tags: git-cliff diffs this tag against the previous one.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          args: --latest --strip header

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.cliff.outputs.changelog }}
          prerelease: ${{ contains(github.ref, 'rc') }}
